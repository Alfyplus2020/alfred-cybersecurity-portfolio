title: NimbusDesk ToolShed Panel Unauthenticated Command Execution (NDSA-2026-0007)
id: c7fd962c-e744-4802-a656-02e085d8072e
status: experimental
description: >
  Detects exploitation of NDSA-2026-0007 ("TOOLSHED") in NimbusDesk Enterprise
  Groupware. The vulnerable ToolShed Panel passes an attacker-controlled cmd string
  to /bin/sh -c via Runtime.exec, so successful exploitation appears as the NimbusDesk
  JVM (java -jar nimbusdesk-toolshed-<version>.jar) spawning a /bin/sh -c child process.
  The single known-benign java-to-shell invocation (the hourly Nimbus Health Sentinel
  self-check, /opt/nimbusdesk/tools/selfcheck.sh) is excluded to avoid false positives.
references:
  - NDSA-2026-0007 TOOLSHED advisory (CIS*6580 course material)
  - https://attack.mitre.org/techniques/T1059/004/
  - https://attack.mitre.org/techniques/T1190/
author: Alfred Amoah
date: 2026/08/04
tags:
  - attack.execution
  - attack.t1059.004
  - attack.initial_access
  - attack.t1190
logsource:
  product: linux
  category: process_creation
detection:
  selection_parent_jvm:
    ParentCommandLine|contains: 'nimbusdesk-toolshed-'
  selection_child_shell:
    Image|endswith: '/sh'
    CommandLine|contains: '-c'
  filter_benign_selfcheck:
    CommandLine|contains: '/opt/nimbusdesk/tools/selfcheck.sh'
  condition: selection_parent_jvm and selection_child_shell and not filter_benign_selfcheck
falsepositives:
  - The hourly Nimbus Health Sentinel self-check (explicitly excluded by filter)
  - Legitimate administrative scripts invoked through the NimbusDesk JVM, if any exist in the environment
level: high
